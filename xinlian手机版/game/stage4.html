<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>信连 · 钱包</title>
<link rel="stylesheet" href="css/common.css">
<style>
  .wallet-card { padding:20px 14px; background:linear-gradient(135deg,#08C260,#06AD56); color:#fff; margin-bottom:10px; position:relative; }
  .wallet-card.frozen { background:linear-gradient(135deg,#888,#666); }
  .wallet-card .lbl { font-size:12px; opacity:.8; }
  .wallet-card .bal { font-size:28px; font-weight:600; margin-top:6px; }
  .wallet-card .note { font-size:11px; opacity:.8; margin-top:8px; }
  .wallet-actions { padding:0 14px 14px; }
  .wallet-actions button { width:100%; padding:12px; background:#08C260; color:#fff; border:0; border-radius:6px; font-size:15px; cursor:pointer; margin-bottom:8px; }
  .wallet-list { padding:0; }
  .wallet-list .app-row .bd .n { font-size:13px; }
  .wallet-list .app-row .amt { font-size:14px; color:#333; font-weight:600; }
  .wallet-list .app-row .amt.neg { color:#c33; }
  .sort-bar { display:flex; gap:8px; padding:10px 14px; background:#fff; border-bottom:1px solid #f0f0f0; }
  .sort-bar button { flex:1; padding:8px; background:#08C260; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:13px; }

  .evt-mask { position:fixed; inset:0; background:rgba(60,0,0,.75); z-index:9000; display:none; }
  .evt-mask.on { display:block; }
  .evt-banner { position:absolute; top:0; left:0; right:0; padding:12px; background:#a00; color:#fff; font-family:Consolas,monospace; font-size:13px; text-align:center; letter-spacing:1px; }
  .evt-hint { position:absolute; bottom:20px; left:0; right:0; text-align:center; color:#ffd; font-size:12px; font-family:Consolas,monospace; }
  .pkt { position:fixed; width:56px; height:56px; background:radial-gradient(circle,#ff5555,#a00); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; font-weight:bold; cursor:pointer; z-index:9100; box-shadow:0 0 18px rgba(255,0,0,.8); pointer-events:auto; font-family:Consolas,monospace; }
  .evt-hit { position:fixed; inset:0; background:rgba(8,194,96,.25); z-index:9050; pointer-events:none; opacity:0; transition:opacity .15s; }
  .evt-hit.on { opacity:1; }
  .evt-shake { animation:evtShake .5s; }
  @keyframes evtShake {
    0%,100% { transform:translateX(0); }
    20% { transform:translateX(-8px); }
    40% { transform:translateX(8px); }
    60% { transform:translateX(-6px); }
    80% { transform:translateX(6px); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="js/save.js"></script>
<script src="js/ui.js"></script>
<script src="js/notes.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  if (!S.guard('wallet')) return;

  const FIB13 = 233;
  const minute = new Date().getMinutes();

  let unlocked = !!S.get('walletUnlocked');
  let sorted = !!S.get('walletSorted');

  function renderOmega(body) {
    body.innerHTML = App.topBar('Ω', { back: true, dots: true }) + '<div class="app-empty">加密通讯</div>';
    App.bindTop({ onBack: () => App.switchChatView('list'), onDots: App.showDots });
  }
  function renderGroup(body) {
    body.innerHTML = App.topBar('修复者联盟', { back: true, dots: true }) + '<div class="app-empty">群聊已解禁</div>';
    App.bindTop({ onBack: () => App.switchChatView('list'), onDots: App.showDots });
  }
  function renderFile(body) {
    body.innerHTML = App.topBar('文件驿站', { back: true, dots: true }) + '<div class="app-empty">已恢复</div>';
    App.bindTop({ onBack: () => App.switchChatView('list'), onDots: App.showDots });
  }

  const contacts = [
    { g: 'A', n: 'Ω', s: '加密通讯' },
    { g: 'A', n: '阿黑', s: '已拉黑' },
    { g: 'B', n: '被拉黑的人', s: '已被拉黑' },
    { g: 'C', n: '残页', s: '已拉黑' },
    { g: 'D', n: '数据包', s: '已拉黑' },
    { g: 'F', n: '斐波那契', s: '已拉黑' },
    { g: 'G', n: '黄金分割', s: '已拉黑' },
    { g: 'H', n: '黑客Ω', s: '已拉黑' },
    { g: 'J', n: '镜像', s: '已拉黑' },
    { g: 'M', n: '密码', s: '已拉黑' },
    { g: 'Q', n: '钱包', s: '已拉黑' },
    { g: 'S', n: '数字根', s: '已拉黑' },
    { g: 'W', n: '文件驿站', s: '已拉黑' },
    { g: 'X', n: '修复协议', s: '已拉黑' },
    { g: 'Y', n: '验证码', s: '已拉黑' }
  ];
  function renderContacts(body) {
    let html = App.topBar('通讯录', { search: true, plus: true }) + '<div style="flex:1;overflow-y:auto;background:#fff">';
    let lastG = '';
    contacts.forEach((c, i) => {
      if (c.g !== lastG) { html += '<div class="app-group">' + c.g + '</div>'; lastG = c.g; }
      html += '<div class="app-row" data-ci="' + i + '"><div class="av">' + c.n.charAt(0) + '</div><div class="bd"><div class="n">' + c.n + '</div><div class="s">' + c.s + '</div></div></div>';
    });
    html += '</div>';
    body.innerHTML = html;
    App.bindTop({ onSearch: () => ui.toast('搜索模块待修复', 'error'), onPlus: App.showPlus });
    body.querySelectorAll('.app-row[data-ci]').forEach(r => {
      r.onclick = () => {
        const c = contacts[+r.dataset.ci];
        if (c.n === 'Ω') ui.toast('加密通讯，请前往聊天', 'ok');
        else ui.toast('发送失败：你已被对方拉黑', 'error');
      };
    });
  }

  function renderMomentsPage(body) {
    body.innerHTML =
      App.topBar('朋友圈', { back: true }) +
      '<div style="flex:1;overflow-y:auto">' +
        '<div style="height:200px;background:linear-gradient(135deg,#08C260,#06AD56)"></div>' +
        '<div class="mom-user" style="display:flex;align-items:flex-end;gap:12px;padding:0 14px;margin-top:-30px">' +
          '<div class="av" style="width:64px;height:64px;border-radius:8px;background:#08C260;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;border:3px solid #fff">Ω</div>' +
          '<div style="padding-bottom:6px;font-size:16px;font-weight:600">Ω</div>' +
        '</div>' +
        '<div style="background:#fff;margin:12px 0;padding:14px;font-size:14px;color:#333">协议已修复。你的选择决定了我的去向。</div>' +
      '</div>';
    App.bindTop({ onBack: () => App.switchDiscoverView('list') });
  }

  function renderMe(body) {
    const acc = S.get('acc') || {};
    body.innerHTML =
      App.topBar('我') +
      '<div class="me-header"><div class="av">' + (acc.nickname ? acc.nickname.charAt(0) : 'Ω') + '</div><div><div class="n">' + (acc.nickname || '修复者') + '</div><div class="s">微信号：' + (acc.phone || 'wxid_omega') + '</div></div></div>' +
      '<div class="me-list">' +
        '<div class="app-row" id="goWallet"><div class="bd"><div class="n">服务（钱包）</div><div class="s">' + (unlocked ? '已解冻' : '冻结') + '</div></div><div class="arrow">›</div></div>' +
        '<div class="app-row disabled"><div class="bd"><div class="n">收藏</div><div class="s">待修复</div></div></div>' +
        '<div class="app-row" id="goMoments"><div class="bd"><div class="n">朋友圈</div><div class="s">已修复</div></div><div class="arrow">›</div></div>' +
        '<div class="app-row disabled"><div class="bd"><div class="n">作品</div><div class="s">待修复</div></div></div>' +
        '<div class="app-row disabled"><div class="bd"><div class="n">设置</div><div class="s">待修复</div></div></div>' +
      '</div>' +
      '<div class="me-list">' +
        '<div class="app-row" id="mAbout"><div class="bd"><div class="n">关于信连</div></div><div class="arrow">›</div></div>' +
        '<div class="app-row" id="mNotes"><div class="bd"><div class="n">Ω 的数学笔记</div></div><div class="arrow">›</div></div>' +
      '</div>';
    document.getElementById('goWallet').onclick = () => App.switchMeView('wallet');
    document.getElementById('goMoments').onclick = () => { App.switchTab('discover'); App.switchDiscoverView('moments'); };
    document.getElementById('mAbout').onclick = () => location.href = 'about.html?from=stage4';
    document.getElementById('mNotes').onclick = () => location.href = 'notes.html?from=stage4';
  }

  const billsRaw = [
    { t: '转账给 阿黑', amt: '-12.00', n: 12, note: '已拉黑' },
    { t: '转账给 Ω', amt: '-0.01', n: 0.01, note: '坐标：经度 116.4' },
    { t: '收款 from 数据包', amt: '+1.00', n: 1, note: 'Payload Injected' },
    { t: '收款 from 修复者', amt: '+233.33', n: 233.33, note: '收藏密码 = 斐波那契第13项 + 当前分钟数' },
    { t: '转账给 残页', amt: '-7.00', n: 7, note: '质数账单' },
    { t: '收款 from 验证码', amt: '+3.00', n: 3, note: '质数账单' }
  ];

  function isPrimeN(n) {
    const x = Math.floor(Math.abs(n));
    if (x < 2) return false;
    for (let i = 2; i * i <= x; i++) if (x % i === 0) return false;
    return true;
  }

  function renderWallet(body) {
    body.innerHTML =
      App.topBar('服务', { back: true }) +
      '<div class="wallet-card ' + (unlocked ? '' : 'frozen') + '">' +
        '<div class="lbl">余额' + (unlocked ? '' : '（冻结）') + '</div>' +
        '<div class="bal">¥ ' + (unlocked ? '0.01' : '0.00') + '</div>' +
        '<div class="note">' + (unlocked ? '钱包已解冻' : '钱包已冻结，请完成解冻') + '</div>' +
      '</div>' +
      (unlocked ? '' : '<div class="wallet-actions"><button id="thaw">充值 0.01 元解冻</button></div>') +
      '<div class="app-group">账单</div>' +
      (unlocked && !sorted ? '<div class="sort-bar"><button id="sortBtn">按质数/合数排序</button></div>' : '') +
      '<div class="me-list wallet-list" id="billList"></div>' +
      (unlocked ? '<div style="padding:16px"><button id="transferBtn" style="width:100%;padding:12px;background:#08C260;color:#fff;border:0;border-radius:6px;font-size:15px;cursor:pointer">转账</button></div>' : '');
    App.bindTop({ onBack: () => App.switchMeView('main') });

    const list = document.getElementById('billList');
    let listData = billsRaw;
    if (sorted) {
      const primes = billsRaw.filter(b => isPrimeN(b.n));
      const comps = billsRaw.filter(b => !isPrimeN(b.n));
      listData = primes.concat(comps);
    }
    list.innerHTML = listData.map((b, i) =>
      '<div class="app-row" data-bi="' + i + '"><div class="bd"><div class="n">' + b.t + '</div><div class="s">' + b.note + '</div></div><div class="amt ' + (b.amt.startsWith('-') ? 'neg' : '') + '">' + b.amt + '</div></div>'
    ).join('');
    list.querySelectorAll('.app-row[data-bi]').forEach(r => {
      r.onclick = () => {
        const b = listData[+r.dataset.bi];
        if (b.note.includes('收藏密码')) ui.toast(b.note + '（第13项=233，密码=' + (FIB13 + minute) + '）', 'ok');
        else ui.toast(b.t + ' ' + b.amt, 'ok');
      };
    });

    const thaw = document.getElementById('thaw');
    if (thaw) thaw.onclick = openThaw;

    const sortBtn = document.getElementById('sortBtn');
    if (sortBtn) sortBtn.onclick = () => {
      sorted = true;
      S.set('walletSorted', true);
      App.rerender();
      ui.toast('排序完成', 'ok');
      checkStage();
    };

    const tr = document.getElementById('transferBtn');
    if (tr) tr.onclick = () => ui.toast('请输入密码（本阶段跳过）', 'ok');
  }

  function openThaw() {
    const mask = ui.el('div', 'ui-mask');
    mask.innerHTML =
      '<div class="ui-popup">' +
        '<div class="ui-popup-title">解冻钱包</div>' +
        '<div class="ui-popup-body">' +
          '<div style="font-size:13px;margin-bottom:8px">充值 0.01 元以解冻</div>' +
          '<input id="thawAmt" placeholder="输入金额" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:14px">' +
        '</div>' +
        '<div class="ui-popup-btns">' +
          '<button class="ui-btn" id="thawCancel">取消</button>' +
          '<button class="ui-btn primary" id="thawOk">确认</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);
    document.getElementById('thawCancel').onclick = () => mask.remove();
    document.getElementById('thawOk').onclick = () => {
      const v = document.getElementById('thawAmt').value.trim();
      mask.remove();
      if (v === '-0.01') {
        unlocked = true;
        S.set('walletUnlocked', true);
        ui.toast('解冻成功', 'ok');
        App.rerender();
        setTimeout(startEvent, 400);
      } else {
        ui.toast('金额无效', 'error');
        S.add('errors', 1);
      }
    };
  }

  function startEvent() {
    const mask = ui.el('div', 'evt-mask on');
    mask.innerHTML =
      '<div class="evt-banner" id="evtBanner">WARNING: Ω Egress Traffic Detected.</div>' +
      '<div class="evt-hint">点击红色数据包，拦截 3 次</div>';
    document.body.appendChild(mask);
    typeBanner('WARNING: Ω Egress Traffic Detected.', 900, () => spawnPacket(mask, 0));
  }

  function typeBanner(text, dur, cb) {
    const b = document.getElementById('evtBanner');
    let i = 0;
    const t = setInterval(() => {
      b.textContent = text.slice(0, i);
      i++;
      if (i > text.length) { clearInterval(t); setTimeout(cb, dur); }
    }, 40);
  }

  function spawnPacket(mask, hits) {
    if (hits >= 3) return endEventSuccess(mask);
    const pkt = document.createElement('div');
    pkt.className = 'pkt';
    pkt.textContent = 'Ω';
    document.body.appendChild(pkt);

    const W = window.innerWidth, H = window.innerHeight;
    const M = 30;
    const pts = [];
    const steps = 4;
    for (let i = 0; i <= steps; i++) pts.push({ x: M + (W - 2 * M) * i / steps, y: M });
    for (let i = 0; i <= steps; i++) pts.push({ x: W - M, y: M + (H - 2 * M) * i / steps });
    for (let i = 0; i <= steps; i++) pts.push({ x: W - M - (W - 2 * M) * i / steps, y: H - M });
    for (let i = 0; i <= steps; i++) pts.push({ x: M, y: H - M - (H - 2 * M) * i / steps });

    let seg = 0, segT = 0;
    const speed = 3.0;
    let raf = null, timer = null;

    function tick() {
      segT += 0.012 * speed;
      if (segT >= 1) { segT = 0; seg++; if (seg >= pts.length - 1) seg = 0; }
      const a = pts[seg], b = pts[seg + 1] || pts[0];
      pkt.style.left = (a.x + (b.x - a.x) * segT - 28) + 'px';
      pkt.style.top = (a.y + (b.y - a.y) * segT - 28) + 'px';
      raf = requestAnimationFrame(tick);
    }
    tick();

    timer = setTimeout(() => {
      cancelAnimationFrame(raf);
      pkt.remove();
      ui.toast('Packet Dropped. 回滚 8%', 'error');
      S.add('errors', 1);
      S.progress(Math.max(0, S.get('progress') - 8));
      document.body.classList.add('evt-shake');
      setTimeout(() => document.body.classList.remove('evt-shake'), 500);
      setTimeout(() => spawnPacket(mask, hits), 600);
    }, 1500);

    pkt.onclick = () => {
      clearTimeout(timer);
      cancelAnimationFrame(raf);
      pkt.remove();
      const hit = ui.el('div', 'evt-hit on');
      document.body.appendChild(hit);
      ui.beep(880, 0.1, 'square', 0.08);
      setTimeout(() => hit.remove(), 150);
      spawnPacket(mask, hits + 1);
    };
  }

  function endEventSuccess(mask) {
    mask.remove();
    document.querySelectorAll('.pkt').forEach(p => p.remove());
    S.set('pktDone', true);
    S.progress(65);
    ui.omega('你躲过了我的反击，但我的核心还没暴露。');
    ui.toast('Payload Injected. 跳过支付密码', 'ok');
    checkStage();
  }

  function checkStage() {
    if (S.get('stage4Done')) return;
    if (unlocked && S.get('pktDone') && sorted) {
      S.set('stage4Done', true);
      S.unlock('fav');
      S.progress(65);
      setTimeout(() => {
        ui.popup('阶段完成', '钱包已解冻。<br>修复进度 65%', [{
          t: '前往收藏', primary: true, fn: () => {
            S.set('stage', 'stage5');
            location.href = 'stage5.html';
          }
        }]);
      }, 600);
    }
  }

  App.init(document.getElementById('root'), {
    defaultTab: 'me',
    renderOmega, renderGroup, renderFile, renderContacts, renderMomentsPage, renderMe, renderWallet,
    onScan: () => ui.toast('扫一扫模块待修复', 'error')
  });

  setTimeout(() => App.switchMeView('wallet'), 30);
})();
</script>
</body>
</html>
